<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모집병 일정판</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFEA; --surface:#F7F8F5; --ink:#1D2420; --muted:#5E675F; --line:#C9CEC6;
  --army:#55642F; --navy:#1E3D6B; --airforce:#2F7FB8; --marine:#B3261E;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161A17; --surface:#1F2420; --ink:#E6E9E3; --muted:#9AA39B; --line:#343B35;
  --army:#97A862; --navy:#7499D2; --airforce:#6CB2E0; --marine:#E2675F;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--font);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:28px 0 18px;border-bottom:2px solid var(--ink)}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
header .upd{font-size:13px;color:var(--muted)}
.warn{margin:12px 0 0;font-size:14px;color:var(--marine)}

/* hero: 가장 가까운 마감 */
.hero{padding:32px 0 28px;border-bottom:1px solid var(--line)}
.hero .lead{font-size:15px;color:var(--muted);margin:0 0 6px}
.hero .clock{font-size:clamp(44px,11vw,88px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0}
.hero .clock small{font-size:.38em;font-weight:500;letter-spacing:0;margin-left:.2em}
.hero .what{margin:14px 0 0;padding-left:12px;border-left:6px solid var(--b,var(--ink));font-size:17px;font-weight:500}
.hero .what span{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.hero .also{margin:18px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.hero .also li{padding:3px 0}
.hero .also b{color:var(--ink);font-weight:500}

/* filters */
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px var(--font);padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--paper)}
.toggle{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}

/* recruit rows */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:6px 1fr;gap:0 16px;padding:20px 0;border-bottom:1px solid var(--line)}
.row .stripe{background:var(--b);border-radius:3px}
.row.done{opacity:.55}
.row .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.row h3{margin:0;font-size:17px;font-weight:500;line-height:1.45}
.row .sub{font-size:13px;color:var(--muted);margin-top:2px}
.badge{flex:none;font-size:13px;font-weight:500;padding:3px 10px;border-radius:4px;white-space:nowrap;border:1.5px solid var(--ink)}
.badge.open{background:var(--ink);color:var(--paper)}
.badge.open::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--marine);margin-right:6px;vertical-align:1px;animation:blink 1.4s steps(2) infinite}
.badge.wait,.badge.done{border-color:var(--line);color:var(--muted)}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.badge.open::before{animation:none}}
.count{margin:10px 0 0;font-size:15px}
.count b{font-weight:700}

.track{position:relative;height:18px;margin:16px 0 4px}
.track .rail{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line)}
.track .fill{position:absolute;left:0;top:8px;height:2px;background:var(--b)}
.track .dot{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:var(--surface);border:2px solid var(--b)}
.track .dot.past{background:var(--b)}
.track .now{position:absolute;top:0;width:2px;height:18px;margin-left:-1px;background:var(--ink)}

dl.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;margin:10px 0 0;font-size:14px}
dl.dates div{display:flex;flex-direction:column}
dl.dates dt{color:var(--muted);font-size:12.5px}
dl.dates dd{margin:0}
dl.dates .past dd{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px}
.acts a,.acts button{font:500 14px var(--font);color:var(--ink);background:none;border:0;padding:0;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);cursor:pointer}
.acts a:hover,.acts button:hover{text-decoration-color:var(--ink)}
details.att{font-size:14px;margin-top:8px;color:var(--muted)}
details.att summary{cursor:pointer}
details.att ul{margin:6px 0 0;padding-left:18px}

.empty{padding:28px 0;color:var(--muted)}

/* notices */
section.notices{margin:40px 0 0}
section.notices h2{font-size:18px;margin:0 0 4px}
.nlist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.nlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.nlist a{text-decoration:none}
.nlist a:hover{text-decoration:underline}
.nlist time{flex:none;font-size:13px;color:var(--muted)}
.new{font-size:11.5px;font-weight:700;color:var(--marine);margin-left:6px}

footer{margin:48px 0 32px;font-size:13px;color:var(--muted)}
@media (max-width:560px){
  .row .top{flex-direction:column;gap:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>모집병 일정판</h1>
    <div class="upd num" id="upd">불러오는 중</div>
  </header>
  <div id="warn"></div>

  <section class="hero" id="hero" aria-live="polite"></section>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="군 선택"></div>
    <label class="toggle"><input type="checkbox" id="showDone"> 종료된 일정 표시</label>
  </div>
  <ul class="list" id="list"></ul>

  <section class="notices">
    <h2>최근 공지</h2>
    <div class="chips" id="nchips" role="group" aria-label="공지 게시판 선택"></div>
    <ul class="nlist" id="nlist"></ul>
  </section>

  <footer>
    병무청 누리집 게시글을 12시간마다 모아 정리한 비공식 페이지입니다. 지원 전 반드시 원문을 확인하세요.
    접수는 <a href="https://www.mma.go.kr" rel="noopener">병무청 누리집</a>에서 합니다.
  </footer>
</div>

<script>
const BR = {
  army:{name:"육군", c:"var(--army)"},
  navy:{name:"해군", c:"var(--navy)"},
  airforce:{name:"공군", c:"var(--airforce)"},
  marine:{name:"해병대", c:"var(--marine)"},
};
const EV = [["apply","접수"],["first","1차 발표"],["practical","실기평가"],["exam","모집신검"],["final","최종 발표"],["enlist","입영"]];
const DOWS = "일월화수목금토";
const state = {data:null, branch:"all", nboard:"army", showDone:false};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function monthStart(m){ const [y,mo]=m.split("-").map(Number); return new Date(Date.UTC(y,mo-1,1,-9)); }
function evStart(ev){ return !ev ? null : ev.month ? monthStart(ev.month) : new Date(ev.start); }
function evEnd(ev){ return !ev || ev.month ? null : ev.end ? new Date(ev.end) : null; }

// KST 기준 표시
function kst(d){ return new Date(d.getTime() + 9*3600e3); }
function fmt(d, withTime=true){
  const k = kst(d), nowY = kst(new Date()).getUTCFullYear();
  const y = k.getUTCFullYear();
  let s = (y!==nowY ? y+". " : "") + (k.getUTCMonth()+1) + "." + k.getUTCDate() + "(" + DOWS[k.getUTCDay()] + ")";
  if (withTime) s += " " + String(k.getUTCHours()).padStart(2,"0") + ":" + String(k.getUTCMinutes()).padStart(2,"0");
  return s;
}
function fmtEv(ev){
  if (ev.month){ const [y,m]=ev.month.split("-"); return `${y}년 ${+m}월 중`; }
  const s = new Date(ev.start), e = ev.end && new Date(ev.end), t = !ev.dateOnly;
  return e ? `${fmt(s,t)} ~ ${fmt(e,t)}` : fmt(s,t);
}
function dayDiff(target, now){
  const a = kst(now), b = kst(target);
  const da = Date.UTC(a.getUTCFullYear(),a.getUTCMonth(),a.getUTCDate());
  const db = Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate());
  return Math.round((db-da)/864e5);
}
function remain(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
  const hms = [h,m,sec].map(x=>String(x).padStart(2,"0")).join(":");
  return {d, hms, text: d>0 ? `${d}일 ${h}시간` : hms};
}

function status(r, now){
  const a = r.events.apply, s = evStart(a), e = evEnd(a);
  if (s && now < s) return {k:"soon", label:"접수 예정", target:s, what:"접수 시작"};
  if (e && now < e) return {k:"open", label:"접수 중", target:e, what:"접수 마감"};
  for (const [k,l] of EV.slice(1)){
    const ev = r.events[k]; if (!ev) continue;
    const t = evStart(ev);
    if (t > now) return {k:"wait", label:`${l} 대기`, target:t, what:l, month:!!ev.month};
  }
  return {k:"done", label:"종료"};
}
const ORDER = {open:0, soon:1, wait:2, done:3};

function renderHeader(){
  const d = state.data, u = new Date(d.updated_at);
  $("upd").textContent = "마지막 갱신 " + fmt(u);
  const msgs = [];
  if (Date.now() - u > 30*3600e3) msgs.push("갱신이 30시간 넘게 멈춰 있습니다. 수집 작업 상태를 확인하세요.");
  if (d.errors && d.errors.length) msgs.push(`마지막 수집에서 ${d.errors.length}건을 가져오지 못했습니다. 일부 정보가 이전 상태일 수 있습니다.`);
  $("warn").innerHTML = msgs.map(m=>`<p class="warn">${esc(m)}</p>`).join("");
}

function renderHero(now){
  const rs = state.data.recruits.map(r=>({r, st:status(r,now)}));
  const open = rs.filter(x=>x.st.k==="open").sort((a,b)=>a.st.target-b.st.target);
  const soon = rs.filter(x=>x.st.k==="soon").sort((a,b)=>a.st.target-b.st.target);
  const main = open[0] || soon[0];
  if (!main){ $("hero").innerHTML = `<p class="lead">지금 접수 중이거나 예정된 모집이 없습니다.</p>`; return; }
  const left = remain(main.st.target - now);
  const clock = left.d > 0 ? `${left.d}<small>일</small> ${left.hms}` : left.hms;
  const others = (open[0] ? open.slice(1) : soon.slice(1)).slice(0,4);
  const lead = open[0] ? `가장 먼저 마감되는 접수, ${fmt(main.st.target)} 마감` : `다음 접수 시작, ${fmt(main.st.target)}`;
  $("hero").innerHTML = `
    <p class="lead">${esc(lead)}</p>
    <p class="clock num">${clock}</p>
    <p class="what" style="--b:${BR[main.r.branch].c}">${esc(main.r.title)}<span>${BR[main.r.branch].name}${main.r.round?` ${main.r.round}회차`:""}</span></p>
    ${others.length?`<ul class="also">${others.map(x=>`<li><b>${BR[x.r.branch].name}</b> ${esc(x.r.title)}, ${remain(x.st.target-now).text} 남음</li>`).join("")}</ul>`:""}`;
}

function track(r, now){
  const pts = EV.map(([k])=>r.events[k] && {k, t:evStart(r.events[k])}).filter(Boolean);
  if (pts.length < 2) return "";
  const a = evEnd(r.events.apply); if (a) pts.push({k:"applyEnd", t:a});
  const min = Math.min(...pts.map(p=>p.t)), max = Math.max(...pts.map(p=>p.t));
  const pos = t => ((t-min)/(max-min||1)*100).toFixed(2);
  const nowPos = Math.min(100, Math.max(0, pos(now)));
  return `<div class="track" aria-hidden="true"><div class="rail"></div><div class="fill" style="width:${nowPos}%"></div>
    ${pts.map(p=>`<span class="dot${p.t<=now?" past":""}" style="left:${pos(p.t)}%"></span>`).join("")}
    ${now>min && now<max ? `<span class="now" style="left:${nowPos}%"></span>`:""}</div>`;
}

function row(r, now){
  const st = status(r, now), b = BR[r.branch];
  let count = "";
  if (st.target){
    const rem = remain(st.target-now), dd = dayDiff(st.target, now);
    count = st.month
      ? `<p class="count">${esc(st.what)}까지 약 <b>${Math.max(0,dd)}일</b></p>`
      : `<p class="count num">${esc(st.what)}까지 <b>${rem.text}</b>${dd>0?` (D-${dd})`:dd===0?" (오늘)":""}</p>`;
  }
  const dates = EV.filter(([k])=>r.events[k]).map(([k,l])=>{
    const ev = r.events[k], end = evEnd(ev) || evStart(ev);
    return `<div class="${end<now?"past":""}"><dt>${l}</dt><dd class="num">${esc(fmtEv(ev))}</dd></div>`;
  }).join("");
  const sub = [b.name, r.round && `${r.round}회차`, r.extra && "추가모집", r.posted && `게시 ${r.posted}`].filter(Boolean).join(" / ");
  const atts = r.attachments?.length ? `<details class="att"><summary>첨부파일 ${r.attachments.length}개</summary><ul>${
    r.attachments.map(a=>`<li><a href="${esc(a.url)}" rel="noopener">${esc(a.name)}</a></li>`).join("")}</ul></details>` : "";
  return `<li class="row ${st.k}" style="--b:${b.c}">
    <div class="stripe"></div>
    <div>
      <div class="top"><div><h3>${esc(r.title)}</h3><div class="sub">${esc(sub)}</div></div>
        <span class="badge ${st.k}">${st.label}</span></div>
      ${count}${track(r,now)}
      <dl class="dates">${dates}</dl>
      <div class="acts"><a href="${esc(r.url)}" rel="noopener" target="_blank">원문 보기</a>
        <button type="button" data-ics="${esc(r.id)}">캘린더에 추가</button></div>
      ${atts}
    </div></li>`;
}

function renderList(now){
  let rs = state.data.recruits.map(r=>({r, st:status(r,now)}));
  if (state.branch!=="all") rs = rs.filter(x=>x.r.branch===state.branch);
  const hidden = rs.filter(x=>x.st.k==="done").length;
  if (!state.showDone) rs = rs.filter(x=>x.st.k!=="done");
  rs.sort((a,b)=> ORDER[a.st.k]-ORDER[b.st.k] || (a.st.target||0)-(b.st.target||0));
  $("list").innerHTML = rs.length ? rs.map(x=>row(x.r,now)).join("")
    : `<li class="empty">표시할 모집 일정이 없습니다.${hidden?` 종료된 일정 ${hidden}건은 "종료된 일정 표시"를 켜면 보입니다.`:""}</li>`;
}

function renderChips(){
  const opts = [["all","전체",null], ...Object.entries(BR).map(([k,v])=>[k,v.name,v.c])];
  $("chips").innerHTML = opts.map(([k,n,c])=>`<button class="chip" data-b="${k}" aria-pressed="${state.branch===k}"${c?` style="--c:${c}"`:""}>${n}</button>`).join("");
  const nopts = [...Object.entries(BR).map(([k,v])=>[k,v.name,v.c]), ["score","지난회차 합격점수",null]];
  $("nchips").innerHTML = nopts.map(([k,n,c])=>`<button class="chip" data-n="${k}" aria-pressed="${state.nboard===k}"${c?` style="--c:${c}"`:""}>${n}</button>`).join("");
}

function renderNotices(){
  const now = Date.now();
  const ns = state.data.notices.filter(n => state.nboard==="score" ? n.board==="score" : n.board==="notice" && n.branch===state.nboard);
  $("nlist").innerHTML = ns.length ? ns.map(n=>{
    const isNew = n.posted && now - new Date(n.posted+"T00:00:00+09:00") < 3*864e5;
    return `<li><a href="${esc(n.url)}" rel="noopener" target="_blank">${esc(n.title)}${isNew?'<span class="new">NEW</span>':""}</a><time class="num">${esc(n.posted||"")}</time></li>`;
  }).join("") : `<li class="empty">이 게시판의 공지를 아직 가져오지 못했습니다.</li>`;
}

// .ics 생성
function icsDate(d){ return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsDay(d){ const k=kst(d); return `${k.getUTCFullYear()}${String(k.getUTCMonth()+1).padStart(2,"0")}${String(k.getUTCDate()).padStart(2,"0")}`; }
function downloadIcs(id){
  const r = state.data.recruits.find(x=>x.id===id); if (!r) return;
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//mma-schedule//KO","CALSCALE:GREGORIAN"];
  const name = `[${BR[r.branch].name}] ${r.title}`;
  const add = (summary, s, e, allDay) => {
    lines.push("BEGIN:VEVENT", `UID:${r.id}-${summary}@mma-schedule`, `DTSTAMP:${icsDate(new Date())}`);
    if (allDay){
      const end = new Date((e||s).getTime()+864e5);
      lines.push(`DTSTART;VALUE=DATE:${icsDay(s)}`, `DTEND;VALUE=DATE:${icsDay(end)}`);
    } else {
      lines.push(`DTSTART:${icsDate(s)}`, `DTEND:${icsDate(e||new Date(s.getTime()+3600e3))}`);
    }
    lines.push(`SUMMARY:${(summary+" - "+name).replace(/[,;]/g,"\\$&")}`, `URL:${r.url}`);
    if (summary==="접수 마감") lines.push("BEGIN:VALARM","TRIGGER:-PT24H","ACTION:DISPLAY","DESCRIPTION:접수 마감 하루 전","END:VALARM");
    lines.push("END:VEVENT");
  };
  for (const [k,l] of EV){
    const ev = r.events[k]; if (!ev || ev.month) continue;
    const s = new Date(ev.start), e = ev.end && new Date(ev.end);
    if (k==="apply"){ add("접수 시작", s, null, false); add("접수 마감", e, null, false); }
    else add(l, s, e, ev.dateOnly);
  }
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {type:"text/calendar"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${r.id}.ics`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function tick(){ const now = new Date(); renderHero(now); renderList(now); }

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-b]"), n = e.target.closest("[data-n]"), i = e.target.closest("[data-ics]");
  if (b){ state.branch = b.dataset.b; renderChips(); tick(); }
  if (n){ state.nboard = n.dataset.n; renderChips(); renderNotices(); }
  if (i) downloadIcs(i.dataset.ics);
});
$("showDone").addEventListener("change", e=>{ state.showDone = e.target.checked; tick(); });

fetch("data.json?t="+Date.now()).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
  state.data = d; renderHeader(); renderChips(); renderNotices(); tick();
  setInterval(()=>renderHero(new Date()), 1000);
  setInterval(()=>renderList(new Date()), 60000);
}).catch(()=>{
  $("upd").textContent = "";
  $("hero").innerHTML = `<p class="lead">data.json을 불러오지 못했습니다. 수집 작업이 한 번 이상 실행됐는지 확인한 뒤 새로고침하세요.</p>`;
});
</script>
</body>
</html>
